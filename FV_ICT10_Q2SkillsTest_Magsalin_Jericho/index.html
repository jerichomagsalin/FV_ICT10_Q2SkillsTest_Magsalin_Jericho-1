<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script><title>ICT 10</title>
    <style>

        * {
        font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
        }

        body {
            background-color: #FCE8A4
        }

        h1 {
            text-align:center;
        }

        input[type="text"] {
            font-size: 18px;
            width: 98%;
            text-align: center;
        }

        label {
            font-size:18px;
        }

        .center {
            text-align: center;
        }

        #form-structure {
            margin: auto;
            width: 400px;
            background-color: #337ccf;
            padding: 25px;
            border: 2px solid black;
            border-radius: 4px;
        }

        .result {
            background-color: #CCCCCC;
            padding: 12px 25px 25px 25px;
        }

        #button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
        }

        #button:hover {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            background-color:#81CC69;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <script type="py" src="main.py"></script>

    <br><br><br>

    <div id="form-structure">
        <div class="container">
            <h1>Element Information</h1>
            <p class="center">Enter a nonmetal element in the periodic table</p>
            <input type="text" id='elementinput' placeholder = "Example: Helium">

            <br><br>
        
            <button id="button" py-click="search_element"> Search Element </button>

            <br><br>

            <hr>
            <br>

        
            <div class="result">
                <h3 class="center">Showcase Result</h3>
                <!-- Name, Symbol, atomic_number, atomic)weight-->
                <p><b>Element Name:</b><span id="name"></span></p>
                <p><b>Element Symbol:</b><span id="symbol"></span></p>
                <p><b>Atomic Number:</b><span id="number"></span></p>
                <p><b>Atomic Weight:</b><span id="weight"></span></p>
            </div>
        </div>
    </div>
</body>
</html>
